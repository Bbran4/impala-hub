name: CI

on:
  push:
    branches: [main, supabase-migration, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - name: Type-check frontend and API, then build
        run: npm run build

  supabase-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase start
      - run: python scripts/test_sales_desk_concurrency.py
      - name: Verify Storage size and MIME enforcement over HTTP
        run: python scripts/test_storage_upload_limits.py
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
